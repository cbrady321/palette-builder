<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <button id="addPaletteBtn" class="add-button">+ Add Palette</button>
        <button id="exportBtn" class="export-button">Export</button>
        <button id="importBtn" class="import-button">Import</button>
        <button id="resetBtn" class="reset-button">Reset to Defaults</button>
        <div id="palettesContainer"></div>
    </div>

    <div id="exportModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
        <div class="modal-content">
            <span class="close" aria-label="Close">&times;</span>
            <h2 id="exportModalTitle">Export Configuration</h2>
            <textarea id="configTextarea" readonly></textarea>
        </div>
    </div>

    <div id="importModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
        <div class="modal-content">
            <span class="close" aria-label="Close">&times;</span>
            <h2 id="importModalTitle">Import Configuration</h2>
            <textarea id="importTextarea" rows="10"></textarea>
            <button id="applyImportBtn" class="add-button">Apply</button>
        </div>
    </div>

    <div id="colorMenu" class="color-menu" data-popper-placement="bottom">
        <button id="openPickerBtn" aria-label="Open color picker">Open Color Picker</button>
        <button id="deleteColorBtn" aria-label="Delete this color">Delete Color</button>
    </div>

    <script src="https://unpkg.com/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="utils.js"></script>
    <script src="ColorPalette.js"></script>
    <script src="app.js"></script>
</body>
</html>
